[build]
  command = "bun install && bun run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "20"

# Proxy Lovable-hosted CDN assets (gallery images, logos, payment images)
# so `/__l5e/...` URLs keep resolving when served from Netlify.
[[redirects]]
  from = "/__l5e/*"
  to = "https://id-preview--a58c577e-1526-4752-b178-1c6b93b4c91b.lovable.app/__l5e/:splat"
  status = 200
  force = true
